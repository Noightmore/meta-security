# Minimum accepted length
minlen = 12

# Do not let character classes reduce the effective minimum length
dcredit = 0
ucredit = 0
lcredit = 0
ocredit = 0

# Reject passwords too similar to the previous password
difok = 4

# Reject excessive repeated and sequential characters
maxrepeat = 3
maxsequence = 3

# Reject dictionary words
dictcheck = 1

# Reject passwords containing the username
usercheck = 1
usersubstr = 4

# Reject weak passwords instead of merely warning
enforcing = 1

# Apply the checks when root changes a password too
enforce_for_root

# password change attempt count
retry = 3