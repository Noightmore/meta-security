################################################################################
# General kernel hardening
################################################################################

# Restrict exposure of kernel pointer addresses.
# Value 2 hides kernel pointers even from privileged users, reducing information
# available for attacks that rely on knowledge of kernel memory addresses.
kernel.kptr_restrict = 2

# Restrict unprivileged access to performance monitoring.
# Suitable for production images where user-space profiling is not required.
# Higher values can make debugging and performance analysis more difficult.
# The baseline value was 2; this policy raises it to 3 for production systems.
kernel.perf_event_paranoid = 3

# Restrict access to kernel log messages.
kernel.dmesg_restrict = 1

# Enable full userspace address-space randomization.
kernel.randomize_va_space = 2

# Disable automatic loading of TTY line disciplines.
dev.tty.ldisc_autoload = 0

# Disable Magic SysRq on production systems.
# The baseline value 16 allows the sync command; disabling SysRq reduces
# exposed kernel debugging/recovery functionality.
kernel.sysrq = 0

# its the default setting but lynis profile suggests disabling kernel module loading and unloading
# perhaps set this value way longer in a different way since syctl starts pretty early
# kernel.modules_disabled = 0