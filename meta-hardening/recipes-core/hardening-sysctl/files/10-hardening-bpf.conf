################################################################################
# BPF kernel hardening
################################################################################

# Disable unprivileged BPF usage.
# Value 1 prevents unprivileged bpf() calls and cannot be reverted at runtime.
kernel.unprivileged_bpf_disabled = 1

# Enable BPF JIT hardening for all users.
# This trades some JIT performance for protection against JIT spraying.
# 0 = no JIT hardening
# 1 = harden JIT for unprivileged users
# 2 = harden JIT for all users
net.core.bpf_jit_harden = 2